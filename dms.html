<style>

#ov{position:fixed;inset:0;background:rgba(14,27,46,.5);display:none;z-index:60}#ov.on{display:block}#dr{position:fixed;top:0;right:-460px;width:440px;max-width:100%;height:100%;background:#fff;z-index:61;box-shadow:-8px 0 30px rgba(0,0,0,.15);transition:right .3s;display:flex;flex-direction:column}#dr.on{right:0}
.dh{padding:22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.dh h2{font-size:16px}.dh .m{font-size:12px;color:var(--soft);margin-top:3px}.x{border:0;background:var(--paper);width:28px;height:28px;border-radius:50%;flex:none}.db{padding:20px 22px;overflow-y:auto;flex:1}.ds{margin-bottom:24px}.ds h4{font:700 10.5px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:11px}

.f{margin-bottom:13px}.f label{display:block;font-size:11.5px;font-weight:700;color:var(--soft);margin-bottom:5px}.f select,.f input,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;background:var(--paper);color:var(--navy)}.f :focus{border-color:var(--gold);outline:0}

.rq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;box-shadow:var(--shadow)}.rq b{color:var(--navy)}.rq small{color:var(--soft);font-size:12px;display:block;margin-top:3px}
.bp{font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px}.pending{background:var(--gold-pale);color:var(--gold-deep)}.approved{background:var(--green-soft);color:var(--green)}.declined{background:var(--red-soft);color:var(--red)}
.lr{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft)}.lr:last-child{border:0}.lr i{width:7px;height:7px;border-radius:50%;background:var(--gold);margin-top:7px;flex:none}.lr small{display:block;font-size:11px;color:var(--faint)}
.ag{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.k{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}.k small{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:600}.k b{display:block;font:600 25px 'Space Grotesk',sans-serif;color:var(--navy)}
#t{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw}#t.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){#lay{flex-direction:column}#sb{width:100%;display:flex;overflow-x:auto;gap:4px;padding:12px;border:0;border-bottom:1px solid var(--line)}.g,.fn{display:none}.d{white-space:nowrap}.ag,.kp{grid-template-columns:1fr 1fr}.ag{grid-template-columns:1fr}#main{padding:22px 16px}.usr small,.env{display:none}}

<script>
const D=[["indiv","Individual Tax Services"],["corp","Corporate & Business Tax"],["intl","International Tax"],["indirect","Indirect Tax (VAT/Sales Tax)"],["controversy","Tax Controversy & Resolution"],["tp","Transfer Pricing"],["bookkeeping","Bookkeeping & Accounting"],["compliance","Compliance & Quality Control"],["it","Information Technology"],["clientrel","Client Relations & Marketing"],["adminhr","Administration & HR"]];
const U={name:"Tunde Alabi",home:"corp"},TODAY=new Date().toISOString().slice(0,10);
let F=[
{id:"j1",name:"Coral Foods Ltd — Corporate Tax Return FY2025",dept:"corp",tag:"Client: Coral Foods · Filing",mod:"1 day ago",sens:0,g:[{to:"bookkeeping",lv:"view",exp:null,by:"Tunde Alabi"}],from:null},
{id:"j2",name:"Coral Foods Ltd — Transfer Pricing Study",dept:"tp",tag:"Client: Coral Foods · Advisory",mod:"3 days ago",sens:0,g:[],from:null},
{id:"j3",name:"Lagos Textiles — VAT Audit Response",dept:"indirect",tag:"Client: Lagos Textiles · FIRS Query",mod:"2 days ago",sens:0,g:[],from:null},
{id:"j4",name:"Okafor Family Trust — Personal Returns",dept:"indiv",tag:"Client: Okafor Family · Filing",mod:"5 days ago",sens:0,g:[],from:null},
{id:"j5",name:"Meridian Freight — Tax Controversy Case File",dept:"controversy",tag:"Restricted · Tribunal Matter",mod:"1 day ago",sens:1,g:[],from:null},
{id:"j6",name:"General Ledger — FY2025 Close",dept:"bookkeeping",tag:"Internal · Accounting",mod:"1 week ago",sens:0,g:[{to:"corp",lv:"view",exp:"2027-01-31",by:"Funke Adeyemi (Bookkeeping Head)"}],from:null},
{id:"j7",name:"Client Data Handling Policy",dept:"compliance",tag:"Internal · Policy",mod:"2 weeks ago",sens:0,g:[],from:null}];
const LV=["view","comment","edit","manage"];
let R=[{id:"r1",f:"j2",from:"tp",to:"corp",by:"Tunde Alabi",reason:"Advisory phase complete — Corporate & Business Tax will handle the filing implications.",st:"pending"}];
let L=[{a:"Tunde Alabi",x:"granted Bookkeeping & Accounting → view access",d:"Coral Foods Ltd — Corporate Tax Return FY2025",t:"1 day ago"},{a:"System",x:"file uploaded",d:"Meridian Freight — Tax Controversy Case File",t:"1 day ago"},{a:"Funke Adeyemi (Bookkeeping Head)",x:"granted Corporate & Business Tax → view access",d:"General Ledger — FY2025 Close",t:"3 days ago"},{a:"System",x:"Compliance review completed",d:"Client Data Handling Policy",t:"2 weeks ago"}];
const S={role:"head",dept:"audit",tab:"files"},$=s=>document.querySelector(s),dn=i=>(D.find(d=>d[0]===i)||[])[1]||i,gf=i=>F.find(f=>f.id===i);
const wide=()=>S.role==="director"||S.role==="eqcr",hd=d=>d===U.home;
const gr=(f,d)=>f.g.find(g=>g.to===d&&(!g.exp||g.exp>=TODAY));
const vis=d=>wide()?F.filter(f=>f.dept===d):hd(d)?F.filter(f=>f.dept===d):F.filter(f=>f.dept===d&&gr(f,U.home));
const acc=d=>wide()?true:S.role==="admin"?false:hd(d)||F.some(f=>f.dept===d&&gr(f,U.home));
const mg=f=>S.role==="head"&&f.dept===U.home;
const ce=f=>{if(wide()||S.role==="admin")return false;if(f.dept===U.home)return true;const g=gr(f,U.home);return g&&(g.lv==="edit"||g.lv==="manage")};
function why(f){if(S.role==="director")return["p","Visible to you as Director — firm-wide read access for oversight."];if(S.role==="eqcr")return["p","Visible to you as Compliance Review — every view is logged for the audit trail."];
if(f.dept===U.home)return f.from?["t","Owned by your department — transferred from "+dn(f.from)+"."]:["o","Your department owns this file."];const g=gr(f,U.home);return g?["g","Shared by "+dn(f.dept)+" — "+g.lv+" access"+(g.exp?", expires "+g.exp:", no expiry")+"."]:["n","No access."]}
function toast(m){const t=$("#t");t.textContent=m;t.classList.add("on");clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove("on"),2600)}
function sidebar(){const e=$("#sb");if(S.role==="admin"){e.innerHTML='<div class="g">Departments (structure only)</div>'+D.map(d=>`<div class="d lk">${d[1]}</div>`).join("");return}
e.innerHTML='<div class="g">Joma Departments</div>'+D.map(d=>{const a=acc(d[0]);return `<div class="d ${S.dept===d[0]?"on":""} ${a?"":"lk"}" onclick="${a?`pick('${d[0]}')`:`toast('No access — ${dn(d[0]).replace(/'/g,"")} has not shared any files with you.')`}"><span>${d[1]}</span>${hd(d[0])?'<span class="ht">HOME</span>':a?"":'<span class="l">🔒</span>'}</div>`}).join("")+'<div class="fn">Custodian keeps a permanent, timestamped record of every grant, transfer and cross-department view for Joma Consulting.</div>'}

({files,requests,log,admin})[S.tab](e)}

function drawer(){const f=gf(ds.id);if(!f)return;const m=mg(f),opts=D.filter(d=>d[0]!==f.dept).map(d=>`<option value="${d[0]}">${d[1]}</option>`).join("");
$("#dr").innerHTML=`<div class="dh"><div><h2>${f.name}</h2><div class="m">${f.tag}</div></div><button class="x" onclick="cd()">✕</button></div><div class="db">
<div class="ds"><h4>Why you can see this</h4><div class="rb">${why(f)[1]}</div></div>
<div class="ds"><h4>Current Access Grants</h4>${f.g.length?f.g.map(g=>`<div class="gr"><div><b>${dn(g.to)}</b><small>${g.lv} · ${g.exp?"expires "+g.exp:"no expiry"} · by ${g.by}</small></div>${m?`<button class="lb" onclick="rv('${f.id}','${g.to}')">Revoke</button>`:""}</div>`).join(""):'<div class="sub">Not shared with any other department.</div>'}</div>
${m?`<div class="ds"><h4>Share With Another Department</h4><div class="f"><label>Department</label><select id="sd">${opts}</select></div><div class="f"><label>Permission level</label><div class="lv">${LV.map(l=>`<div class="${ds.lv===l?"s":""}" onclick="sl('${l}')">${l[0].toUpperCase()+l.slice(1)}</div>`).join("")}</div></div><div class="f"><label>Expiry (optional)</label><input type="date" id="se"></div><button class="btn bn" style="width:100%;justify-content:center" onclick="sg()">Grant Access</button></div>
<div class="ds"><h4>Transfer Ownership</h4><div class="f"><label>Move this file to</label><select id="td">${opts}</select></div><div class="f"><label>Reason</label><textarea id="tr" rows="2" placeholder="e.g. Engagement complete, handing off"></textarea></div><button class="btn bl" style="width:100%;justify-content:center" onclick="st()">Request Transfer</button></div>`:""}
<div class="ds"><h4>File Activity</h4><div class="sub">Modified ${f.mod}${f.from?"<br>Transferred from "+dn(f.from):""}</div></div></div>
<div class="df"><button class="btn bl" style="flex:1;justify-content:center" onclick="cd()">Close</button><button class="btn bg" style="flex:1;justify-content:center" ${ce(f)?"":"disabled"} onclick="toast('Opening in source application…')">Open File</button></div>`}
function rv(i,d){const f=gf(i);f.g=f.g.filter(g=>g.to!==d);L.unshift({a:U.name,x:"revoked "+dn(d)+" access",d:f.name,t:"just now"});toast("Access revoked for "+dn(d)+".");drawer();all()}
function sg(){const f=gf(ds.id),d=$("#sd").value,x=$("#se").value||null;f.g=f.g.filter(g=>g.to!==d);f.g.push({to:d,lv:ds.lv,exp:x,by:U.name});L.unshift({a:U.name,x:"granted "+dn(d)+" → "+ds.lv+" access",d:f.name,t:"just now"});toast("Shared with "+dn(d)+".");drawer();all()}
function st(){const f=gf(ds.id),d=$("#td").value;R.unshift({id:"r"+Date.now(),f:f.id,from:f.dept,to:d,by:U.name,reason:$("#tr").value||"No reason provided.",st:"pending"});L.unshift({a:U.name,x:"requested transfer to "+dn(d),d:f.name,t:"just now"});toast("Transfer request sent to "+dn(d)+" for approval.");cd();all()}
$("#rs").onchange=e=>{S.role=e.target.value;S.dept=U.home;S.tab=S.role==="admin"?"admin":"files";all()};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;all()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")cd()});
function all(){$("#ul").textContent=dn(U.home);sidebar();tabs();main();$("#rs").value=S.role}
all();
</script></body></html>
