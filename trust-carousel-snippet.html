<style>
/* ===== Trust carousel (dual-direction marquee, as on chatfeatured.com) ===== */
.trust-car{--tc-ink:var(--navy);--tc-accent:var(--gold);--tc-speed:48s;padding:8px 0 0;text-align:center}
.trust-car .tc-label{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--tc-accent);margin-bottom:28px}
.tc-row{overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.tc-row+.tc-row{margin-top:22px}
.tc-track{display:flex;width:max-content;animation:tc-left var(--tc-speed) linear infinite;will-change:transform}
.tc-row.rev .tc-track{animation-name:tc-right}
.tc-logo{display:flex;align-items:center;gap:11px;padding-right:64px;flex:none;color:var(--tc-ink);opacity:.62;filter:grayscale(1);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.tc-logo svg{width:30px;height:30px;flex:none}
@keyframes tc-left{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes tc-right{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.tc-track{animation:none}}
</style>

<!-- PASTE THIS MARKUP INSIDE THE TRUST SECTION -->
<div class="trust-car reveal" id="trustCar" aria-label="Organisations we work with">
  <div class="tc-label">Trusted by leading organisations</div>
  <div class="tc-row"><div class="tc-track" data-names="Meridian Freight|Coral Foods|Lagos Textiles|Northgate Capital|Savannah Energy|Atlas Logistics|Harmattan Foods|Crestline Bank|Bluewater Marine|Kingsway Estates"></div></div>
  <div class="tc-row rev"><div class="tc-track" data-names="Orchid Health|Sahel Agro|Ironbridge Steel|Palmgrove Hotels|Quantum Telecoms|Riverstone Mining|Summit Insurance|Tidewater Oil|Unity Microfinance|Vantage Print"></div></div>
</div>

<script>
/* Trust carousel: builds each row, then duplicates it so the -50% loop is seamless. Replace the placeholder names/SVGs with real client logos (<img>) later. */
(function(){
  var shapes=['<circle cx="15" cy="15" r="13" fill="currentColor"/>','<rect x="3" y="3" width="24" height="24" rx="5" fill="currentColor"/>','<path d="M15 2l12 7v12l-12 7L3 21V9z" fill="currentColor"/>','<path d="M15 2l13 13-13 13L2 15z" fill="currentColor"/>','<path d="M3 26L15 4l12 22z" fill="currentColor"/>'];
  document.querySelectorAll('#trustCar .tc-track').forEach(function(t){
    var set=t.dataset.names.split('|').map(function(n,i){
      var m=n.charAt(0);
      return '<div class="tc-logo"><svg viewBox="0 0 30 30" aria-hidden="true">'+shapes[i%shapes.length]+'<text x="15" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="sans-serif">'+m+'</text></svg><span>'+n+'</span></div>';
    }).join('');
    t.innerHTML=set+set;
  });
})();
</script>
